version: '3.8'

services:
  # MCP Server - Exposes tools via Model Context Protocol
  mcp-server:
    build:
      context: ./src/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/mcp/list_tools"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Agent Service - Orchestrates RAG and MCP
  agent-service:
    build:
      context: ./src/agent-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PROJECT_ID=${GCP_PROJECT_ID}
      - LOCATION=us-central1
      - MCP_SERVER_URL=http://mcp-server:8080
      - RAG_ENDPOINT_ID=${RAG_ENDPOINT_ID}
    depends_on:
      - mcp-server
    networks:
      - mcp-network
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  # Web Application - Next.js Frontend
  web-app:
    build:
      context: ./src/web-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AGENT_SERVICE_URL=http://agent-service:8000
    depends_on:
      - agent-service
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
