# GCP Cloud Build Configuration
# Project: MCP + RAG + AI Agent
# Model: Gemini 3.0 Pro
# Last Updated: 2026-02-14

steps:
  # Build MCP Server
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-tools:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-tools:latest'
      - './src/mcp-server'
    id: 'build-mcp-server'

  # Build Agent Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-agent:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-agent:latest'
      - './src/agent-service'
    id: 'build-agent-service'

  # Build Web App
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-web-app:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mcp-web-app:latest'
      - './src/web-app'
    id: 'build-web-app'

  # Push MCP Server
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mcp-tools:$SHORT_SHA'
    id: 'push-mcp-server'
    waitFor: ['build-mcp-server']

  # Push Agent Service
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mcp-agent:$SHORT_SHA'
    id: 'push-agent-service'
    waitFor: ['build-agent-service']

  # Push Web App
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mcp-web-app:$SHORT_SHA'
    id: 'push-web-app'
    waitFor: ['build-web-app']

  # Deploy MCP Server to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mcp-tools'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mcp-tools:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
    id: 'deploy-mcp-server'
    waitFor: ['push-mcp-server']

  # Deploy Agent Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mcp-agent'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mcp-agent:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PROJECT_ID=$PROJECT_ID,MCP_SERVER_URL=https://mcp-tools-xxxxx-uc.a.run.app'
    id: 'deploy-agent-service'
    waitFor: ['push-agent-service', 'deploy-mcp-server']

  # Deploy Web App to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mcp-web-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mcp-web-app:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'AGENT_SERVICE_URL=https://mcp-agent-xxxxx-uc.a.run.app'
    id: 'deploy-web-app'
    waitFor: ['push-web-app', 'deploy-agent-service']

images:
  - 'gcr.io/$PROJECT_ID/mcp-tools:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/mcp-tools:latest'
  - 'gcr.io/$PROJECT_ID/mcp-agent:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/mcp-agent:latest'
  - 'gcr.io/$PROJECT_ID/mcp-web-app:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/mcp-web-app:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
